apiVersion: torresmo.io/v1
kind: DevSession
metadata:
  name: my-api-dev
spec:
  deployment: my-api
  sync:
    - local: ./src
      remote: /app/src
    - local: ./config
      remote: /app/config
  command: "go run ./cmd/api"
  ports:
    - "8080:8080"
    - "9229:9229"
  env:
    - name: DEBUG
      value: "true"
    - name: LOG_LEVEL
      value: "debug"
